[package]
name = "zenmon-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zenmon"
path = "src/main.rs"

[features]
default = ["tui"]
# `tui` pulls in the ratatui dashboard (and its arboard clipboard dep, which
# needs X11/Wayland). Build `--no-default-features` for headless targets like
# Android/Termux where no display server is present.
tui = ["dep:zenmon-tui"]

[dependencies]
zenmon-core.workspace = true
zenmon-tui = { workspace = true, optional = true }
zenoh.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
color-eyre.workspace = true
humantime.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
