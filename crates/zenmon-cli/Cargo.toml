[package]
name = "zenmon-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zenmon"
path = "src/main.rs"

[features]
default = ["tui", "clipboard"]
# `tui` pulls in the ratatui dashboard. It runs anywhere a terminal does,
# including Termux on Android. `clipboard` adds the arboard-backed copy action,
# which needs X11/Wayland — split out so display-less targets can keep the TUI.
#   default                          -> desktop: full TUI + clipboard
#   --no-default-features --features tui -> Android/Termux: TUI, no clipboard
#   --no-default-features            -> headless CLI only
tui = ["dep:zenmon-tui"]
clipboard = ["zenmon-tui/clipboard"]

[dependencies]
zenmon-core.workspace = true
zenmon-tui = { workspace = true, optional = true }
zenoh.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
color-eyre.workspace = true
humantime.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
