name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: build & test (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # `--locked` throughout, so a Cargo.toml change that forgot to commit the
      # updated Cargo.lock fails here rather than during a release — the
      # release workflow builds `--locked` too, and that is a bad place to
      # discover the lockfile is stale.
      #
      # `--exclude zenmon-tray`: the tray is a Tauri app, so on Linux it wants
      # GTK/webkit development packages this runner does not have, and
      # `--workspace` has failed on `glib-sys` ever since tray/src-tauri joined
      # the workspace — this job had been red for a week without anyone
      # noticing, which is worse than not running it. Installing the GTK stack
      # to lint a Windows-only app is the wrong trade; the tray is compiled for
      # real by the `build-tray` job in release.yml, on Windows, through the
      # Tauri CLI (a bare cargo build of it produces a broken binary anyway —
      # see tray/README.md). Excluding by name rather than relying on
      # `default-members` keeps a future crate covered by default.
      - name: clippy
        run: cargo clippy --locked --workspace --exclude zenmon-tray --all-targets
      - name: test
        run: cargo test --locked --workspace --exclude zenmon-tray

  headless:
    name: headless build (Android-like, no X11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # display-less targets (Android/Termux) have no X11, so arboard can't
      # build. Two supported configs must keep compiling there:
      #   --no-default-features            -> headless CLI only (no TUI)
      #   --features tui (no clipboard)    -> full ratatui dashboard, minus copy
      # Without these gates, a change that recouples the CLI to the TUI, or the
      # TUI to arboard, would only surface on an actual Android build.
      - name: check headless CLI (--no-default-features)
        run: cargo check --locked -p zenmon-cli --no-default-features
      - name: clippy headless CLI
        run: cargo clippy --locked -p zenmon-cli --no-default-features --all-targets
      - name: check TUI without clipboard (--features tui)
        run: cargo check --locked -p zenmon-cli --no-default-features --features tui
      - name: clippy TUI without clipboard
        run: cargo clippy --locked -p zenmon-cli --no-default-features --features tui --all-targets
