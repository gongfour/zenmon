[package]
name = "zenmon-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System tray capture toggle for zenmon"

[[bin]]
name = "zenmon-tray"
path = "src/main.rs"

[lib]
name = "zenmon_tray"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zenmon-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
toml = "1"
directories = "6"

# Release builds are GUI-subsystem (see main.rs), which means no console and no
# std handles — these are what reattach one when a terminal launched us.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
