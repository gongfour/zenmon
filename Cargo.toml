[workspace]
resolver = "2"
members = [
    "crates/zenmon-core",
    "crates/zenmon-cli",
    "crates/zenmon-tui",
    # Tauri app: Rust backend lives under the frontend project, mirroring the
    # standard Tauri layout (crates/ stays pure-Rust crates).
    "tray/src-tauri",
]

# zenmon-tray is deliberately excluded from the default set. Tauri decides
# dev-vs-production from the `custom-protocol` feature, which only the Tauri
# CLI passes — so a bare `cargo build --release` would emit a *dev* binary that
# looks for the vite dev server, and it would land on the exact same path the
# real build writes to (`target/release/zenmon-tray.exe`), silently replacing a
# working binary with a broken one. Build the tray with `npm run tauri build`
# (see tray/README.md); `cargo build --workspace` still reaches it if you
# explicitly ask for it.
default-members = [
    "crates/zenmon-core",
    "crates/zenmon-cli",
    "crates/zenmon-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zenmon-core = { path = "crates/zenmon-core" }
zenmon-tui = { path = "crates/zenmon-tui", default-features = false }
zenoh = { version = "1.7", features = ["unstable"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"
thiserror = "2"
bitflags = "2"
humantime = "2"
base64 = "0.22"
rmpv = "1"
